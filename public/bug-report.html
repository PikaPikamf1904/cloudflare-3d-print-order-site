<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d3bd1"><title>Report a problem | 3D Print Orders</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><script src="/theme.js" defer></script><script src="/bug-report.js" defer></script></head>
<body><a class="skip-link" href="#bug-form">Skip to report form</a><header class="site-header"><div class="header-inner"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">3D</span><span><small>ENRICHMENT PROGRAM</small><strong>3D Print Orders</strong></span></a><button class="icon-button theme-toggle" type="button" aria-label="Switch color theme"><span aria-hidden="true">☾</span></button></div></header>
<main class="simple-page"><section class="content-card"><span class="eyebrow">HELP US FIX IT</span><h1>Report a problem</h1><p>Tell us what went wrong. Do not include passwords, payment information, or other sensitive details.</p><form id="bug-form" novalidate><label>Where did it happen?<select name="category" required><option value="store_catalog">Store or catalog</option><option value="cart">Cart</option><option value="checkout">Checkout</option><option value="receipt">Order receipt</option><option value="admin_login">Admin login</option><option value="accessibility">Accessibility</option><option value="other">Other</option></select></label><label>What happened?<textarea name="description" maxlength="1500" rows="6" required aria-describedby="bug-help"></textarea><small id="bug-help">Please use 10–1,500 characters. Do not include payment, password, or account details.</small></label><label>Order number <span class="optional">Optional</span><input name="orderId" maxlength="80" autocomplete="off"></label><label>Email for a follow-up <span class="optional">Optional</span><input name="contactEmail" type="email" maxlength="120" autocomplete="email"></label><label class="toggle-row bug-consent"><span><strong>Include basic device details</strong><small>Shares only screen size, language, theme, and time-zone offset. Never cookies, saved data, payment details, or passwords.</small></span><input name="diagnosticConsent" type="checkbox"></label><div class="honeypot" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><div id="bug-message" class="form-message" role="status" aria-live="polite"></div><div class="form-actions"><button id="bug-submit" class="button button-primary" type="submit">Send report</button><a class="button button-secondary" href="/">Back to shop</a></div></form></section></main></body></html>
