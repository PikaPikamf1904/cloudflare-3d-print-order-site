<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Print Admin</title><link rel="stylesheet" href="/admin.css"></head><body><main><section id="login"><h1>Admin dashboard</h1><form><input id="key" type="password" autocomplete="current-password" placeholder="Admin key" required><button>Open dashboard</button></form><p id="error" role="alert"></p></section><section id="dash" hidden><header><h1>Dashboard</h1><button id="reload">Refresh</button><p id="notice" role="status"></p></header><section id="stats" class="cards"></section><section class="panel"><h2>Find orders</h2><div class="filters"><input id="q" placeholder="Name, email, or order ID"><select id="status"><option value="">All statuses</option><option>New</option><option>Printing</option><option>Ready</option><option>Complete</option><option>Cancelled</option><option>Historical</option></select><select id="payment"><option value="">Paid or unpaid</option><option>Paid</option><option>Unpaid</option></select><select id="class"><option value="">All classes</option><option>Yellow</option><option>Blue</option></select><select id="source"><option value="">Current and legacy</option><option>Current</option><option>Legacy</option></select><select id="deleted"><option value="active">Active</option><option value="deleted">Trash</option><option value="all">All</option></select><button id="clear">Clear</button><button id="export">Download CSV</button></div></section><section class="panel"><div id="orders" aria-live="polite">Loading orders…</div></section><section class="panel"><h2>Store settings</h2><form id="config"><input name="storeName" placeholder="Store name"><label><input type="checkbox" name="orderingOpen"> Ordering open</label><label><input type="checkbox" name="absenceEnabled"> Show absence notice</label><textarea name="absenceMessage" placeholder="Absence announcement"></textarea><textarea name="paymentInstructions" placeholder="Cash instructions"></textarea><textarea name="priceDisclaimer" placeholder="Price disclaimer"></textarea><fieldset><legend>Payment methods</legend><label><input type="checkbox" name="cashEnabled"> Cash</label><label><input type="checkbox" name="stripeEnabled"> Card payments</label><label><input type="checkbox" name="cashAppEnabled"> Cash App Pay through Stripe</label><label><input type="checkbox" name="paypalEnabled"> PayPal</label><select name="paypalMode"><option value="sandbox">PayPal sandbox</option><option value="live">PayPal live</option></select><p id="credentials"></p></fieldset><button>Save settings</button></form></section><section class="panel"><h2>Products</h2><div id="products"></div></section></section></main><dialog id="detail"><form method="dialog"><button aria-label="Close">×</button></form><div id="detailBody"></div></dialog><script src="/admin.js"></script></body></html>
