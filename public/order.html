<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order receipt</title><link rel="stylesheet" href="/styles.css"></head><body><main><h1>Order receipt</h1><div id="receipt" role="status">Loading…</div></main><script>const box=document.querySelector('#receipt'),m=c=>`$${(c/100).toFixed(2)}`,id=decodeURIComponent(location.pathname.split('/').pop());async function api(p,o){const r=await fetch(p,o);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function el(t,v){const e=document.createElement(t);e.textContent=v;return e}async function load(){try{const d=await api('/api/orders/'+encodeURIComponent(id)),o=d.order;box.replaceChildren(el('h2',o.id),el('p',`${o.status} · ${o.paymentStatus} · ${m(o.total_cents)}`));const list=document.createElement('ul');o.items.forEach(i=>list.append(el('li',`${i.quantity}× ${i.product_name} (${i.color}) — ${m(i.line_total_cents)}`)));box.append(list);if(o.paymentStatus==='Unpaid'){box.append(el('h3',`Pay exactly ${m(o.total_cents)}`));if(d.paymentMethods.stripe){const b=el('button','Pay with Card / Cash App');b.onclick=async()=>{try{const x=await api(`/api/orders/${encodeURIComponent(id)}/pay/stripe`,{method:'POST'});location.href=x.checkoutUrl}catch(e){box.append(el('p',e.message))}};box.append(b)}if(d.paymentMethods.paypal){const b=el('button','Pay with PayPal');b.onclick=async()=>{try{const x=await api(`/api/orders/${encodeURIComponent(id)}/pay/paypal`,{method:'POST'});if(x.approvalUrl)location.href=x.approvalUrl;else throw Error('PayPal approval link unavailable')}catch(e){box.append(el('p',e.message))}};box.append(b)}if(d.paymentMethods.cash)box.append(el('p','Pay with cash. Exact change is appreciated.'))}}catch(x){box.textContent=x.message}}load()</script></body></html>
